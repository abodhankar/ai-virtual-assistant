apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nemoguardrails
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: TCP
    {{- end }}
  selector:
    app: {{ .Release.Name }}-nemoguardrails